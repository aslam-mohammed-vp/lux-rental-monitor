name: Test iPhone Notification

on:
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Test Notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [[ -z "$NTFY_TOPIC" ]]; then
            echo "::error::Set the NTFY_TOPIC repository secret before running this workflow."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 3 \
            -H "Title: Lux Rental Monitor" \
            -H "Priority: high" \
            -H "Tags: house" \
            -d "Success! your rental alerts are connected." \
            "https://ntfy.sh/$NTFY_TOPIC"
