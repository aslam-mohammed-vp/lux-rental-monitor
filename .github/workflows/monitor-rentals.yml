name: Monitor rentals

on:
  schedule:
    - cron: '*/15 8-19 * * 1-6'
      timezone: 'Europe/Luxembourg'
    - cron: '0 20 * * 1-6'
      timezone: 'Europe/Luxembourg'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rental-monitor
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run_monitor: ${{ steps.window.outputs.run_monitor }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configured monitoring hours
        id: window
        env:
          MONITOR_START: ${{ vars.MONITOR_START || '08:00' }}
          MONITOR_END: ${{ vars.MONITOR_END || '20:00' }}
          MONITOR_TIMEZONE: ${{ vars.MONITOR_TIMEZONE || 'Europe/Luxembourg' }}
          MONITOR_INTERVAL_MINUTES: ${{ vars.MONITOR_INTERVAL_MINUTES || '15' }}
        run: python3 scripts/check_schedule.py

  monitor:
    needs: schedule
    if: needs.schedule.outputs.run_monitor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run checks
        run: python -m unittest discover -s tests -v
      - name: Find new rentals and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
          MONITOR_SOURCES: ${{ vars.MONITOR_SOURCES || 'athome' }}
        run: python scripts/monitor_rentals.py
